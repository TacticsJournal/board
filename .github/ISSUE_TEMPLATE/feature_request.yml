name: Feature request
description: Suggest a focused improvement to the board or its documentation.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What workarounds or other approaches have you tried?
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Project scope
      options:
        - label: I have checked the README and existing issues.
          required: true
        - label: I understand that trademarked names and excluded third-party material have separate rules.
          required: true
